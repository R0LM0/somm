# opencode-zen-go: embedded OpenCode Zen "Go" plan quota curation table.
#
# Maps OpenCode model id (ocId) -> curated {shape, cache_read_ratio, tier_usd,
# multiplier}. The final requests-per-window number is NOT stored here; it is
# derived at request time from these curated inputs plus the model's live
# price (plan-quota-currency spec, Requirement: Embedded Quota Table).
#
# A model absent from this table, OR present but with no resolvable live
# price, falls back to the price/P_min bridge (plan-quota-currency spec,
# Requirement: Fallback for Untabulated Models) instead of failing or being
# excluded.
#
# Shape = observed per-request token pattern (input/cached/output), rounded
# as published by OpenCode. cache_read_ratio = cache-read price ÷ input
# price, used only when the live price source does not report a cache-read
# price directly (design D5). multiplier is omitted (defaults to 1) except
# where OpenCode documents an explicit multiplier (Hy3: 8x).
#
# Prices are always the cheaper variant: off-peak hours and the lower
# context/usage tier, never the peak or higher-tier price (design D4).
#
# MiniMax M2.5 (priced but no published shape) and Ox Alpha Free (no shape,
# no price) are deliberately absent from this table (design D3) — they use
# the untabulated price/P_min fallback bridge instead of a fabricated shape.
#
# Source: openspec/changes/live-quota-derivation/reference-data.md
# (OpenCode live documentation snapshot, captured 2026-08-21).
