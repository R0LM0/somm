name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.26']
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      
      - name: Create mock opencode.json
        run: |
          mkdir -p ~/.config/opencode
          echo '{"mcp":{}}' > ~/.config/opencode/opencode.json
      
      - name: Download dependencies
        run: go mod download
      
      - name: Run vet
        run: go vet ./...
      
      - name: Run tests
        run: go test -cover ./...
